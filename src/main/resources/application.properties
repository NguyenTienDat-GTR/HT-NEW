spring.application.name=HT-MANAGEMENT
#dotenv.system.properties=true
#dotenv.filenames=.env.development
# SERVER CONFIGURATION
server.port=${SERVER_PORT:1007}
server.address=0.0.0.0
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=1KB
# Lấy IP thật của client từ X-Forwarded-For (chỉ tin proxy nội bộ) để rate limit và nhật ký không gom mọi người dùng vào IP của FE.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
# POSTGRESQL CONNECTION
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/ht_management}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.postgresql.Driver}}
# JPA / HIBERNATE PERFORMANCE & VALIDATION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.orm=DEBUG
# DATABASE MIGRATION (FLYWAY)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# DISTRIBUTED CACHE & SESSION (REDIS)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.session.timeout=30m
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
# JSON DATETIME SERIALIZATION
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
# FILE MULTIPART UPLOADS (For Avatars/Certificates)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
# LOGGING SPECIFICATION (Set to INFO/WARN in Production)
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# PRODUCTION MANAGEMENT & MONITORING
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
# EMAIL CONFIGURATION (NOTIFICATION SYSTEM)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
# Địa chỉ giao diện web, dùng tạo đường dẫn trong mã QR chứng nhận (không có dấu / ở cuối).
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
management.health.mail.enabled=false
management.health.rabbit.enabled=false
app.security.jwt.access-secret=${JWT_ACCESS_SECRET}
app.security.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION}
app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.audience=${JWT_AUDIENCE}
app.security.bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME}
app.security.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD}
app.security.bootstrap.super-admin.role-code=${SUPER_ADMIN_ROLE_CODE}
app.security.cookie.access-token-name=${AUTH_ACCESS_COOKIE_NAME:accessToken}
app.security.cookie.refresh-token-name=${AUTH_REFRESH_COOKIE_NAME:refreshToken}
app.security.cookie.path=${AUTH_COOKIE_PATH:/}
app.security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.security.cookie.secure=${AUTH_COOKIE_SECURE:false}
springdoc.swagger-ui.with-credentials=true
app.security.swagger-public-enabled=${APP_SECURITY_SWAGGER_PUBLIC_ENABLED:false}
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.login.limit=${APP_RATE_LIMIT_LOGIN_LIMIT:10}
app.rate-limit.login.window-seconds=${APP_RATE_LIMIT_LOGIN_WINDOW:300}
app.rate-limit.auth.limit=${APP_RATE_LIMIT_AUTH_LIMIT:30}
app.rate-limit.auth.window-seconds=${APP_RATE_LIMIT_AUTH_WINDOW:60}
app.rate-limit.write.limit=${APP_RATE_LIMIT_WRITE_LIMIT:30}
app.rate-limit.write.window-seconds=${APP_RATE_LIMIT_WRITE_WINDOW:60}
app.rate-limit.read.limit=${APP_RATE_LIMIT_READ_LIMIT:120}
app.rate-limit.read.window-seconds=${APP_RATE_LIMIT_READ_WINDOW:60}
app.rate-limit.workflow.limit=${APP_RATE_LIMIT_WORKFLOW_LIMIT:20}
app.rate-limit.workflow.window-seconds=${APP_RATE_LIMIT_WORKFLOW_WINDOW:60}
app.security.permission-expiry-revocation.enabled=${APP_PERMISSION_EXPIRY_REVOCATION_ENABLED:true}
app.security.permission-expiry-revocation.fixed-delay-ms=${APP_PERMISSION_EXPIRY_REVOCATION_FIXED_DELAY_MS:60000}
app.security.permission-expiry-revocation.initial-delay-ms=${APP_PERMISSION_EXPIRY_REVOCATION_INITIAL_DELAY_MS:30000}
