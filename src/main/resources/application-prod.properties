spring.application.name=HT-MANAGEMENT
# SERVER CONFIGURATION
server.port=${SERVER_PORT:1007}
server.address=0.0.0.0
# POSTGRESQL CONNECTION
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://postgres:5432/ht_management}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.postgresql.Driver}}
# JPA / HIBERNATE PERFORMANCE & VALIDATION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# DATABASE MIGRATION (FLYWAY)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# DISTRIBUTED CACHE & SESSION (REDIS)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.session.timeout=30m
# JSON DATETIME SERIALIZATION
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
# FILE MULTIPART UPLOADS (For Avatars/Certificates)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
# LOGGING SPECIFICATION (Set to INFO/WARN in Production)
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=INFO
# PRODUCTION MANAGEMENT & MONITORING
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# EMAIL CONFIGURATION (NOTIFICATION SYSTEM)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.security.jwt.access-secret=${JWT_ACCESS_SECRET}
app.security.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION}
app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.audience=${JWT_AUDIENCE}
app.security.bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME}
app.security.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD}
app.security.bootstrap.super-admin.role-code=${SUPER_ADMIN_ROLE_CODE}
app.security.cookie.access-token-name=${AUTH_ACCESS_COOKIE_NAME:accessToken}
app.security.cookie.refresh-token-name=${AUTH_REFRESH_COOKIE_NAME:refreshToken}
app.security.cookie.path=${AUTH_COOKIE_PATH:/}
app.security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.security.cookie.secure=${AUTH_COOKIE_SECURE:false}
