services:
  # ----------------------------------------------------
  # DATABASE SERVICE (POSTGRESQL)
  # ----------------------------------------------------
  postgres:
    environment:
      POSTGRES_DB: ht_management
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # ----------------------------------------------------
  # DISTRIBUTED CACHE SERVICE (REDIS)
  # ----------------------------------------------------
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  # ----------------------------------------------------
  # MESSAGE BROKER SERVICE (RABBITMQ)
  # ----------------------------------------------------
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # Giao diện Web quản trị: http://localhost:15672

  # ----------------------------------------------------
  # BACKEND APPLICATION SERVICE (HOT-RELOAD DEV)
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ht-management-app-dev
    environment:
      SERVER_PORT: ${SERVER_PORT}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DRIVER: ${DB_DRIVER}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      APP_SECURITY_SWAGGER_PUBLIC_ENABLED: "true"
      # Dev: DB dùng chung giữa các nhánh, nhánh đang chạy có thể thiếu migration đã áp dụng từ nhánh khác nên không dừng khi Flyway thấy migration "missing/future".
      SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:missing,*:future"
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - .:/app
      - gradle_cache:/root/.gradle
    working_dir: /app
    command: ["-Dorg.gradle.wrapper.network.timeout=60000", "bootRun", "--continuous", "--no-daemon", "--console=plain", "--stacktrace"]
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - postgres
      - redis
      - rabbitmq

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  gradle_cache:
