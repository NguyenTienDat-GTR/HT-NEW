name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chia test thành 3 phần chạy song song (mỗi phần có Postgres/Redis/RabbitMQ riêng) để rút ngắn thời gian chờ.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Cac test @SpringBootTest thuong ket noi toi localhost (giong may dev bat compose),
    # nen CI phai bat san Postgres/Redis/RabbitMQ. Test dung Testcontainers van tu bat container rieng.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ht_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ht_management"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Chọn phần test (shard ${{ matrix.shard }}/3)
        id: shard
        run: |
          # Xoay vòng theo tên lớp đã sắp xếp để 3 phần có số lớp xấp xỉ nhau.
          args=$(find src/test/java \( -name '*Test.java' -o -name '*Tests.java' \) | sort \
            | awk -v s=${{ matrix.shard }} '(NR - 1) % 3 == s - 1' \
            | sed -e 's#^src/test/java/##' -e 's#\.java$##' -e 's#/#.#g' -e 's#^#--tests #' \
            | tr '\n' ' ')
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Số lớp test trong phần này: $(echo "$args" | grep -o -e --tests | wc -l)"

      # Testcontainers tu khoi dong Postgres/RabbitMQ bang Docker co san tren runner.
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test ${{ steps.shard.outputs.args }}
        env:
          DB_PASSWORD: postgres
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
          JWT_ACCESS_EXPIRATION: "900000"
          JWT_REFRESH_EXPIRATION: "604800000"
          JWT_ISSUER: ht-management
          JWT_AUDIENCE: ht-management-fe
          SUPER_ADMIN_USERNAME: superadmin
          SUPER_ADMIN_PASSWORD: ci-password
          SUPER_ADMIN_ROLE_CODE: SUPER_ADMIN

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.shard }}
          path: build/reports/tests/test
          retention-days: 7

  # Kiem tra Dockerfile van build duoc (khong push), chay song song voi test.
  # Chi can khi mo PR: luong CD tu build image ngay sau do nen khong lap lai o day.
  docker-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Giữ nguyên tên check `build-test` cho ai đang dùng làm check bắt buộc; gộp kết quả các job trên.
  build-test:
    needs: [test, docker-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tổng hợp kết quả
        run: |
          echo "test=${{ needs.test.result }} docker-check=${{ needs.docker-check.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.docker-check.result }}" = "success" ] || [ "${{ needs.docker-check.result }}" = "skipped" ] || exit 1
