name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers tu khoi dong Postgres/RabbitMQ bang Docker co san tren runner.
      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
        env:
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
          JWT_ACCESS_EXPIRATION: "900000"
          JWT_REFRESH_EXPIRATION: "604800000"
          JWT_ISSUER: ht-management
          JWT_AUDIENCE: ht-management-fe
          SUPER_ADMIN_USERNAME: superadmin
          SUPER_ADMIN_PASSWORD: ci-password
          SUPER_ADMIN_ROLE_CODE: SUPER_ADMIN

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      # Kiem tra Dockerfile van build duoc (khong push).
      - uses: docker/setup-buildx-action@v3
      - name: Docker build check
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
