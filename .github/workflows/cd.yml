name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tên image (GHCR yêu cầu chữ thường)
        id: vars
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ github.sha }}
            ${{ steps.vars.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ubuntu/ht' }}
    steps:
      - uses: actions/checkout@v4

      - name: Gom file gửi lên server (.env lấy từ secret)
        run: |
          mkdir out
          printf '%s\n' "$PROD_ENV_FILE" > out/env.deploy
          cp compose.prod.yaml out/
          # Gửi với tên khác rồi ghi đè TẠI CHỖ trên server: giữ nguyên inode để container Caddy thấy file mới.
          cp deploy/Caddyfile out/Caddyfile.new
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}

      - name: Mở cầu nối SSH qua Cloudflare Tunnel (cổng 22 của server đã đóng với internet)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2025.11.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          nohup cloudflared access tcp --hostname ssh.clead.io.vn --url 0.0.0.0:2222 --service-token-id "$CF_ACCESS_CLIENT_ID" --service-token-secret "$CF_ACCESS_CLIENT_SECRET" > "$RUNNER_TEMP/cloudflared-bridge.log" 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null; then echo "Cổng cầu nối đã mở"; break; fi
            sleep 1
          done
          for i in $(seq 1 3); do
            if ssh-keyscan -T 15 -p 2222 127.0.0.1 2>/dev/null | grep -q "ssh-"; then echo "Cầu nối SSH sẵn sàng (đã bắt tay SSH tới server)"; exit 0; fi
            sleep 3
          done
          cat "$RUNNER_TEMP/cloudflared-bridge.log"
          echo "Không mở được cầu nối SSH qua Cloudflare (kiểm tra secret CF_ACCESS_CLIENT_ID/SECRET và policy Service Auth)"
          exit 1

      - name: Copy file lên server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 172.17.0.1
          port: 2222
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "out/*"
          strip_components: 1
          target: ${{ env.DEPLOY_DIR }}

      - name: Pull image và khởi động lại
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 172.17.0.1
          port: 2222
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_DIR"
            mv env.deploy .env && chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f compose.prod.yaml pull app
            docker compose -f compose.prod.yaml up -d --remove-orphans postgres redis rabbitmq app
            # Caddyfile là bind mount một file (theo inode): ghi đè tại chỗ rồi nạp lại bằng `caddy reload`, không cần
            # tạo lại container nên không đứt kết nối. `up -d caddy` chỉ tạo lại khi biến môi trường của Caddy đổi.
            cat Caddyfile.new > Caddyfile && rm -f Caddyfile.new
            docker compose -f compose.prod.yaml up -d caddy
            docker exec ht-caddy caddy reload --config /etc/caddy/Caddyfile || docker compose -f compose.prod.yaml up -d --force-recreate caddy
            docker logout ghcr.io

            echo "Chờ app healthy..."
            healthy=false
            for i in $(seq 1 40); do
              status="$(docker inspect -f '{{.State.Health.Status}}' ht-app 2>/dev/null || echo starting)"
              echo "[$i/40] ht-app: $status"
              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != "true" ]; then
              docker compose -f compose.prod.yaml logs --tail=200 app
              exit 1
            fi
            echo "Deploy BE OK"
            docker image prune -f
