name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tên image (GHCR yêu cầu chữ thường)
        id: vars
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ github.sha }}
            ${{ steps.vars.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    env:
      # Server production là VPS do người khác quản (không phải AWS). CD KHÔNG ghi đè .env và KHÔNG đụng Postgres/Redis/RabbitMQ/Caddy:
      # chỉ pull image mới của service app rồi khởi động lại đúng service đó. Thư mục/tên file/tên service chỉnh bằng repo variables
      # (Settings > Secrets and variables > Actions > Variables) mà không phải sửa workflow.
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/ht' }}
      COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
      BE_SERVICE: ${{ vars.BE_SERVICE || 'app' }}
    steps:
      - name: Mở cầu nối SSH qua Cloudflare Tunnel (cổng 22 của server đã đóng với internet)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Secret dán từ PowerShell dễ dính ký tự xuống dòng/khoảng trắng: làm sạch trước khi dùng.
          CF_ACCESS_CLIENT_ID="$(printf %s "$CF_ACCESS_CLIENT_ID" | tr -d '[:space:]')"
          CF_ACCESS_CLIENT_SECRET="$(printf %s "$CF_ACCESS_CLIENT_SECRET" | tr -d '[:space:]')"
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2025.11.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          nohup cloudflared access tcp --hostname ssh.clead.io.vn --url 0.0.0.0:2222 --service-token-id "$CF_ACCESS_CLIENT_ID" --service-token-secret "$CF_ACCESS_CLIENT_SECRET" > "$RUNNER_TEMP/cloudflared-bridge.log" 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null; then echo "Cổng cầu nối đã mở"; break; fi
            sleep 1
          done
          for i in $(seq 1 3); do
            if ssh-keyscan -T 15 -p 2222 127.0.0.1 2>/dev/null | grep -q "ssh-"; then echo "Cầu nối SSH sẵn sàng (đã bắt tay SSH tới server)"; exit 0; fi
            sleep 3
          done
          echo "Chẩn đoán: độ dài Client ID=${#CF_ACCESS_CLIENT_ID} (mong đợi 39), Client Secret=${#CF_ACCESS_CLIENT_SECRET} (mong đợi 54 với token dạng cfast_, 64 với token dạng cũ)"
          curl -s -o /dev/null -w "Chẩn đoán: HTTPS tới ssh.clead.io.vn kèm token -> HTTP %{http_code}\n" -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" https://ssh.clead.io.vn || true
          cat "$RUNNER_TEMP/cloudflared-bridge.log"
          echo "Không mở được cầu nối SSH qua Cloudflare (kiểm tra secret CF_ACCESS_CLIENT_ID/SECRET và policy Service Auth)"
          exit 1

      - name: Pull image BE và khởi động lại
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 172.17.0.1
          port: 2222
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_DIR,COMPOSE_FILE,BE_SERVICE
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_DIR"
            # COMPOSE_FILE để trống thì docker compose tự tìm compose.yaml / docker-compose.yml trong thư mục.
            DC="docker compose"
            if [ -n "$COMPOSE_FILE" ]; then DC="docker compose -f $COMPOSE_FILE"; fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $DC pull "$BE_SERVICE"
            $DC up -d --no-deps "$BE_SERVICE"
            docker logout ghcr.io

            echo "Chờ $BE_SERVICE sẵn sàng..."
            ok=false
            for i in $(seq 1 40); do
              cid="$($DC ps -q "$BE_SERVICE")"
              status="starting"
              if [ -n "$cid" ]; then
                status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid" 2>/dev/null || echo starting)"
              fi
              echo "[$i/40] $BE_SERVICE: $status"
              if [ "$status" = "healthy" ]; then ok=true; break; fi
              # Service không khai báo healthcheck: coi là ổn khi đã chạy liên tục ~30 giây.
              if [ "$status" = "running" ] && [ "$i" -ge 6 ]; then ok=true; break; fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              $DC logs --tail=200 "$BE_SERVICE"
              exit 1
            fi
            echo "Deploy BE OK"
            docker image prune -f
