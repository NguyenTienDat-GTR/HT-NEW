# Compose dùng trên server production (AWS EC2).
# Image BE và FE do GitHub Actions build sẵn rồi đẩy lên GHCR, server chỉ pull về.
# BE deploy: pull app + caddy/db. FE deploy: chỉ pull fe (xem cd.yml của từng repo).
name: ht-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Chỉ lắng nghe trên localhost của server: truy cập từ máy cá nhân qua SSH tunnel (pgAdmin), không ra internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ht-network]

  redis:
    image: redis:7-alpine
    container_name: ht-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ht-network]

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: ht-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [ht-network]

  app:
    image: ${APP_IMAGE:-ghcr.io/nguyentiendat-gtr/ht-new:latest}
    container_name: ht-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Máy 4GB RAM chạy chung 6 container: giới hạn heap của JVM.
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1024m
      # Health không phụ thuộc SMTP (Gmail chậm/chặn sẽ làm app bị coi là DOWN).
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    # Không publish cổng ra ngoài: chỉ Caddy và FE (cùng network) gọi được app.
    expose:
      - "${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ht-network]

  fe:
    image: ${FE_IMAGE:-ghcr.io/nguyentiendat-gtr/ht-new-fe:latest}
    container_name: ht-fe
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    networks: [ht-network]

  caddy:
    image: caddy:2-alpine
    container_name: ht-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [ht-network]

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  caddy_data:
  caddy_config:

networks:
  ht-network:
    driver: bridge
