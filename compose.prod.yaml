# Compose dùng trên server production (AWS EC2).
# Image BE và FE do GitHub Actions build sẵn rồi đẩy lên GHCR, server chỉ pull về.
# BE deploy: pull app + caddy/db. FE deploy: chỉ pull fe (xem cd.yml của từng repo).
name: ht-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Chỉ lắng nghe trên localhost của server: truy cập từ máy cá nhân qua SSH tunnel (pgAdmin), không ra internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ht-network]

  redis:
    image: redis:7-alpine
    container_name: ht-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Chỉ mở trên loopback của server để dev đi qua SSH tunnel (tunnel-test-db.ps1); không ra internet.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ht-network]

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: ht-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # Chỉ mở trên loopback của server để dev đi qua SSH tunnel (tunnel-test-db.ps1); không ra internet.
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [ht-network]

  app:
    image: ${APP_IMAGE:-ghcr.io/nguyentiendat-gtr/ht-new:latest}
    container_name: ht-app
    restart: unless-stopped
    # Cho BE tắt nhẹ nhàng (xử lý xong request đang chạy) trước khi bị buộc dừng; khớp spring.lifecycle.timeout-per-shutdown-phase.
    stop_grace_period: 40s
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Máy 4GB RAM chạy chung 6 container: giới hạn heap của JVM.
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1024m
      # Health không phụ thuộc SMTP (Gmail chậm/chặn sẽ làm app bị coi là DOWN).
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    # Không publish cổng ra ngoài: chỉ Caddy và FE (cùng network) gọi được app.
    expose:
      - "${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ht-network]

  fe:
    image: ${FE_IMAGE:-ghcr.io/nguyentiendat-gtr/ht-new-fe:latest}
    container_name: ht-fe
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    networks: [ht-network]

  # ===== Môi trường TEST: chung máy với production nhưng cách ly (database, Redis số 1, vhost RabbitMQ, JWT riêng).
  # Cấu hình nằm hết trong .env.test (do cd-test.yml đưa lên từ secret TEST_ENV_FILE). Chỉ chạy khi được gọi tên.
  app-test:
    image: ${APP_TEST_IMAGE:-ghcr.io/nguyentiendat-gtr/ht-new:test}
    container_name: ht-app-test
    restart: unless-stopped
    # Cho BE tắt nhẹ nhàng (xử lý xong request đang chạy) trước khi bị buộc dừng; khớp spring.lifecycle.timeout-per-shutdown-phase.
    stop_grace_period: 40s
    env_file:
      - path: .env.test
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "1007"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1007/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [ht-network]

  fe-test:
    image: ${FE_TEST_IMAGE:-ghcr.io/nguyentiendat-gtr/ht-new-fe:test}
    container_name: ht-fe-test
    restart: unless-stopped
    networks: [ht-network]

  caddy:
    image: caddy:2-alpine
    container_name: ht-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [ht-network]

  # Cloudflare Tunnel: kênh quản trị đi ra ngoài (server chủ động nối tới Cloudflare), nên có thể ĐÓNG cổng 22 của
  # server. Cấu hình route (ssh.<miền>, db.<miền>...) và chính sách Cloudflare Access làm trên dashboard Zero Trust.
  # Không chạy mặc định; bật bằng: docker compose --profile tunnel up -d cloudflared (cần CLOUDFLARE_TUNNEL_TOKEN trong .env).
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: ht-cloudflared
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # Để route ssh://host.docker.internal:22 trong dashboard Cloudflare trỏ tới sshd của chính máy chủ
    # (cloudflared chạy trong container nên không thấy localhost của máy chủ). host-gateway = IP gateway của network Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ht-network]

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  caddy_data:
  caddy_config:

networks:
  ht-network:
    driver: bridge
