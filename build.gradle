plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'phu-cuong'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // Sinh PDF chứng nhận (mail merge: ảnh nền + chèn text theo tọa độ).
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'

    // Xuất / nhập Excel (.xlsx)
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    // Sinh mã QR chứa mã chứng nhận (chỉ khi bố cục có phần tử QR), vẽ dạng vector vào PDF.
    implementation 'com.google.zxing:core:3.5.3'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Docker Desktop 29 requires Testcontainers 1.21.4 or newer.
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:rabbitmq:1.21.4'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
}

configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.testcontainers') {
            useVersion('1.21.4')
            because('Docker Desktop 29 requires the Testcontainers 1.21.4 compatibility patch')
        }
        if (requested.group == 'org.springframework.security') {
            useVersion('6.5.11')
            because('CVE-2026-47838 is fixed in Spring Security 6.5.11')
        }
        if (requested.group == 'org.apache.tomcat.embed') {
            useVersion('10.1.55')
            because('Tomcat 10.1.55 includes the required 2025-2026 security fixes')
        }
        if (requested.group == 'com.fasterxml.jackson.core' && requested.name == 'jackson-annotations') {
            // Jackson's 2.21.5 BOM intentionally keeps annotations at 2.21.
            useVersion('2.21')
            because('Jackson 2.21.5 does not publish a jackson-annotations 2.21.5 artifact')
        } else if (requested.group == 'com.fasterxml.jackson'
                || requested.group == 'com.fasterxml.jackson.core'
                || requested.group == 'com.fasterxml.jackson.dataformat'
                || requested.group == 'com.fasterxml.jackson.datatype'
                || requested.group == 'com.fasterxml.jackson.module') {
            useVersion('2.21.5')
            because('CVE-2026-54512 through CVE-2026-54515 are fixed in Jackson 2.21.5')
        }
        if (requested.group == 'io.netty') {
            useVersion('4.1.135.Final')
            because('2026 Netty advisories are fixed in 4.1.135.Final')
        }
        if (requested.group == 'org.postgresql' && requested.name == 'postgresql') {
            useVersion('42.7.11')
            because('CVE-2026-42198 is fixed in pgjdbc 42.7.11')
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Mỗi context Spring được cache giữ một pool riêng; giới hạn pool để nhiều context không làm Postgres hết kết nối.
    systemProperty 'spring.datasource.hikari.maximum-pool-size', '2'
    systemProperty 'spring.datasource.hikari.minimum-idle', '0'
}
